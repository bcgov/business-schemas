title = "business-schemas gitleaks config"

# Start from gitleaks' maintained default ruleset and layer an allowlist
# on top for this repo's known false positives, per the Git Hooks RFC:
# https://github.com/bcgov/connect/discussions/23
[extend]
useDefault = true

[allowlist]
description = "Document storage keys in example data/tests (<uuid>.pdf), not secrets"
regexes = [
  '''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.pdf''',
]
